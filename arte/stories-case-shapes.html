<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stories do case · Shapes</title>
<link rel="stylesheet" href="../sistema/fontes.css">
<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/sistema.css">
</head>
<body>
<div class="deck">

<!-- =====================================================================
     01 · ABERTURA — 1080 x 1920

     Primeiro story da sequencia, antes dos cortes de 60 s. Irmao da capa
     do Reels: mesma foto, mesma marca, mesma massa de cor. Como story nao
     tem o recorte do feed, o credito da KA e da VM volta para a mesa da
     foto, em preto, e a forma fica livre para o titulo.
     ===================================================================== -->
<section class="slide slide--story capa-case">

  <img class="capa-case__foto" src="../assets/shapes/produtos-shapes-capa.jpg" alt="">
  <img class="capa-case__marca" src="../assets/shapes/logo-shapes-branco.png" alt="Shapes">

  <div class="capa-case__forma">
    <p class="capa-case__rotulo">Case de marca</p>
    <p class="capa-case__titulo">
      Projeto de<br><strong>Reposicionamento</strong><br><strong>de Marca</strong><br>
      da <span class="marca">SHAPES</span>
    </p>

    <div class="capa-case__credito">
      <p class="capa-case__credito-rotulo">Realizado por</p>
      <div class="capa-case__assinaturas">
        <img src="../assets/logos/ka-marcas-horizontal-bold-branco.png"
             alt="KA Inteligência para Marcas" style="width: 276px">
        <div class="capa-case__filete"></div>
        <img src="../assets/logos/vm-rocks-horizontal-branco.png"
             alt="VM Rocks Design" style="width: 178px">
      </div>
    </div>
  </div>



</section>


<!-- =====================================================================
     02 · ENCERRAMENTO — 1080 x 1920

     Ultimo story, depois dos cortes. Leva para o case no site.

     O botao nao e clicavel: story nao tem botao proprio. Ele e a ancora
     visual, e o adesivo de link do Instagram entra POR CIMA dele. Por isso
     fica na base da forma, na altura em que o adesivo costuma cair.
     ===================================================================== -->
<section class="slide slide--story capa-case">

  <img class="capa-case__foto" src="../assets/shapes/produtos-shapes-capa.jpg" alt="">
  <img class="capa-case__marca" src="../assets/shapes/logo-shapes-branco.png" alt="Shapes">

  <div class="capa-case__forma">
    <p class="capa-case__rotulo">O case completo</p>
    <p class="capa-case__titulo">
      <strong>Da essência</strong><br>ao que se vê
    </p>
    <div class="capa-case__credito">
      <p class="capa-case__credito-rotulo">Realizado por</p>
      <div class="capa-case__assinaturas">
        <img src="../assets/logos/ka-marcas-horizontal-bold-branco.png"
             alt="KA Inteligência para Marcas" style="width: 276px">
        <div class="capa-case__filete"></div>
        <img src="../assets/logos/vm-rocks-horizontal-branco.png"
             alt="VM Rocks Design" style="width: 178px">
      </div>
    </div>

    <p class="capa-case__botao">Ver o case no site</p>
  </div>


</section>

</div>
</body>
</html>
