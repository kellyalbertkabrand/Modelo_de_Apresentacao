<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Sobreposições de vídeo · Shapes</title>
<link rel="stylesheet" href="../sistema/fontes.css">
<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/sistema.css">
<style>
  /* Xadrez apenas para conferir a transparencia no navegador.
     Nao entra no PNG: a exportacao usa omitBackground. */
  body { background:
    repeating-conic-gradient(#cfcec9 0% 25%, #e6e5e0 0% 50%) 50% / 48px 48px; }
</style>
</head>
<body>
<div class="deck">

<!-- =====================================================================
     01 · TITULO DE ABERTURA — 1080 x 1920, fundo transparente

     Posicionado no terco inferior, que e onde a filmagem costuma ter area
     mais escura e onde a legenda ja vive hoje. Como o PNG e do quadro
     inteiro, basta soltar no editor em 100% — sem posicionar nada.
     ===================================================================== -->
<section class="slide slide--story slide--transparente">
  <div class="sobre-video sobre-video--centro" style="top: 1210px">
    <hr class="regua-video">
    <p class="titulo-video">
      Projeto de <strong>Reposicionamento<br>de Marca</strong>
      da <span class="marca">SHAPES</span>
    </p>
  </div>
</section>


<!-- =====================================================================
     02 · LETTERING DE IDENTIFICACAO — 1080 x 1920, fundo transparente

     Nome e papel de quem fala. Alinhado a esquerda, na margem do sistema,
     no terco inferior.
     ===================================================================== -->
<section class="slide slide--story slide--transparente">
  <div class="sobre-video" style="top: 1420px">
    <hr class="filete-nome">
    <p class="nome-video">Larissa Barreto</p>
    <p class="cargo-video">Fundadora da Shapes</p>
  </div>
</section>

<!-- =====================================================================
     03 · TITULO — variante em tinta, para filmagem clara
     ===================================================================== -->
<section class="slide slide--story slide--transparente">
  <div class="sobre-video sobre-video--centro sobre-video--tinta" style="top: 1210px">
    <hr class="regua-video">
    <p class="titulo-video">
      Projeto de <strong>Reposicionamento<br>de Marca</strong>
      da <span class="marca">SHAPES</span>
    </p>
  </div>
</section>


<!-- =====================================================================
     04 · LETTERING — variante em tinta, para filmagem clara
     ===================================================================== -->
<section class="slide slide--story slide--transparente">
  <div class="sobre-video sobre-video--tinta" style="top: 1420px">
    <hr class="filete-nome">
    <p class="nome-video">Larissa Barreto</p>
    <p class="cargo-video">Fundadora da Shapes</p>
  </div>
</section>

</div>
</body>
</html>
