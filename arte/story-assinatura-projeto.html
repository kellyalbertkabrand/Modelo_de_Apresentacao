<!DOCTYPE html>
<html lang="pt-BR">
<head>

<title>Story · Assinatura de Projeto</title>

<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/sistema.css">

<body>
<div class="deck">

<!-- =====================================================================
     STORY · ASSINATURA DE PROJETO — 1080 x 1920

     Peca de fechamento dos videos de projeto. Frase de credito, marca KA
     e marca parceira, nessa ordem de leitura.

     Para outro tipo de projeto, troque apenas o texto dentro de <strong>:
     "posicionamento de marca", "identidade visual", "naming"...

     Cada elemento e uma camada com classe propria — e assim que a animacao
     entra depois, sem remontar o layout.
     ===================================================================== -->
<section class="slide slide--story slide--textura slide--veu">
  <div class="assinatura-projeto">

    <p class="assinatura-projeto__frase" data-camada="frase">
      Projeto de <strong>reposicionamento<br>de marca</strong> realizado por
    </p>

    <hr class="assinatura-projeto__regua" data-camada="regua">

    <img class="assinatura-projeto__ka" data-camada="ka"
         src="../assets/logos/ka-marcas-horizontal-bold.png"
         alt="KA Inteligência para Marcas">

    <hr class="assinatura-projeto__fio" data-camada="fio">

    <img class="assinatura-projeto__cliente" data-camada="cliente"
         src="../assets/logos/vm-rocks-horizontal.png"
         alt="VM Rocks Design">

  </div>
</section>

</div>
</body>
</html>
