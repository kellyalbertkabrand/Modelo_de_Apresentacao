<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Stories do case animados · Shapes</title>
<link rel="stylesheet" href="../sistema/fontes.css">
<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/sistema.css">
</head>
<body>
<div class="deck">

<!-- =====================================================================
     01 · ABERTURA ANIMADA — 1080 x 1920, 5 s

     A ordem de entrada conta a mesma historia do case: a marca do cliente
     primeiro, depois a massa de cor, depois o que foi feito, e por ultimo
     quem fez. O credito chega no fim de proposito: a autoria assina, nao
     abre.

     Primeiro story da sequencia, antes dos cortes de 60 s. Irmao da capa
     do Reels: mesma foto, mesma marca, mesma massa de cor. Como story nao
     tem o recorte do feed, o credito da KA e da VM volta para a mesa da
     foto, em preto, e a forma fica livre para o titulo.
     ===================================================================== -->
<section class="slide slide--story capa-case anima">

  <img class="capa-case__foto deriva" src="../assets/shapes/produtos-shapes-capa.jpg" alt="">
  <img class="capa-case__marca entra-sobe" style="--atraso: 0.15s" src="../assets/shapes/logo-shapes-branco.png" alt="Shapes">

  <div class="capa-case__forma entra-massa" style="--atraso: 0.45s">
    <p class="capa-case__rotulo entra-sobe" style="--atraso: 1.00s">Case de marca</p>
    <p class="capa-case__titulo entra-sobe" style="--atraso: 1.16s">
      Projeto de<br><strong>Reposicionamento</strong><br><strong>de Marca</strong><br>
      da <span class="marca">SHAPES</span>
    </p>

    <div class="capa-case__credito entra-sobe" style="--atraso: 1.62s">
      <p class="capa-case__credito-rotulo">Realizado por</p>
      <div class="capa-case__assinaturas">
        <img src="../assets/logos/ka-marcas-horizontal-bold-branco.png"
             alt="KA Inteligência para Marcas" style="width: 276px">
        <div class="capa-case__filete"></div>
        <img src="../assets/logos/vm-rocks-horizontal-branco.png"
             alt="VM Rocks Design" style="width: 178px">
      </div>
    </div>
  </div>



</section>


<!-- =====================================================================
     02 · ENCERRAMENTO ANIMADO — 1080 x 1920, 5 s

     Mesma ordem, com o botao chegando por ultimo, sozinho. E a unica
     coisa que sobra em cena depois que tudo assentou — que e o trabalho
     dele.

     Ultimo story, depois dos cortes. Leva para o case no site.

     O botao nao e clicavel: story nao tem botao proprio. Ele e a ancora
     visual, e o adesivo de link do Instagram entra POR CIMA dele. Por isso
     fica na base da forma, na altura em que o adesivo costuma cair.
     ===================================================================== -->
<section class="slide slide--story capa-case anima">

  <img class="capa-case__foto deriva" src="../assets/shapes/produtos-shapes-capa.jpg" alt="">
  <img class="capa-case__marca entra-sobe" style="--atraso: 0.15s" src="../assets/shapes/logo-shapes-branco.png" alt="Shapes">

  <div class="capa-case__forma entra-massa" style="--atraso: 0.45s">
    <p class="capa-case__rotulo entra-sobe" style="--atraso: 1.00s">O case completo</p>
    <p class="capa-case__titulo entra-sobe" style="--atraso: 1.16s">
      <strong>Da essência</strong><br>ao que se vê
    </p>
    <div class="capa-case__credito entra-sobe" style="--atraso: 1.62s">
      <p class="capa-case__credito-rotulo">Realizado por</p>
      <div class="capa-case__assinaturas">
        <img src="../assets/logos/ka-marcas-horizontal-bold-branco.png"
             alt="KA Inteligência para Marcas" style="width: 276px">
        <div class="capa-case__filete"></div>
        <img src="../assets/logos/vm-rocks-horizontal-branco.png"
             alt="VM Rocks Design" style="width: 178px">
      </div>
    </div>

    <p class="capa-case__botao entra-sobe" style="--atraso: 2.05s">Ver o case no site</p>
  </div>


</section>

</div>
</body>
</html>
