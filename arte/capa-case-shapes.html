<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Capa de case · Shapes</title>
<link rel="stylesheet" href="../sistema/fontes.css">
<link rel="stylesheet" href="../sistema/tokens.css">
<link rel="stylesheet" href="../sistema/sistema.css">
</head>
<body>
<div class="deck">

<!-- =====================================================================
     CAPA DE CASE · SHAPES — 1080 x 1920

     Identidade da Shapes, extraida do brandbook:
       branco #FFFFFF · preto #010101 · laranja #E37037
       base neutra com a cor entrando como massa organica
       proporcao organica (Fibonacci), nunca geometria perfeita

     A foto de produto aparece em tamanho real, sem veu e sem filtro, numa
     janela aberta no papel. O texto nunca pousa sobre ela — a regra e o
     comentario de .capa-case em sistema/sistema.css.

     O credito da KA e da VM Rocks fica no papel da base: o case e da
     Shapes, a autoria e de quem assina embaixo.

     Conteudo dentro do recorte 1080x1350 da grade do Instagram (y 285 a
     1635), para a capa funcionar tambem na miniatura do perfil.
     ===================================================================== -->
<section class="slide slide--story capa-case">

  <img class="capa-case__foto" src="../assets/shapes/produtos-shapes-capa.jpg" alt="">


  <img class="capa-case__marca" src="../assets/shapes/logo-shapes-branco.png" alt="Shapes">

  <div class="capa-case__forma">
    <p class="capa-case__rotulo">Case de marca</p>
    <p class="capa-case__titulo">
      Projeto de<br><strong>Reposicionamento</strong><br><strong>de Marca</strong><br>
      da <span class="marca">SHAPES</span>
    </p>
  </div>

  <div class="capa-case__credito">
    <p class="capa-case__credito-rotulo">Realizado por</p>
    <div class="capa-case__assinaturas">
      <img src="../assets/logos/ka-marcas-horizontal-bold.png"
           alt="KA Inteligência para Marcas" style="width: 340px">
      <div class="capa-case__filete"></div>
      <img src="../assets/logos/vm-rocks-horizontal.png"
           alt="VM Rocks Design" style="width: 220px">
    </div>
  </div>

</section>

</div>
</body>
</html>
