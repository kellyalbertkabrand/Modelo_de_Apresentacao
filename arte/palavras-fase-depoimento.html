<div class="deck">
<!-- =====================================================================
     PALAVRAS DE FASE — marcos do depoimento, em PNG transparente

     Cada palavra tem corpo proprio para que todas ocupem largura parecida:
     em video elas nunca aparecem juntas, entao o que precisa ser constante
     e a presenca, nao o tamanho da fonte.

     Ordem no video, pelo roteiro:
       Desafio · Essência · Expressão · Ponto de Virada · Clareza
     ===================================================================== -->

<!-- desafio · claro -->
<section class="slide slide--story slide--transparente">
  <div class="sobre-video sobre-video--centro" style="top: 1180px">
    <hr class="regua-video">
    <p class="palavra-fase" style="--corpo-palavra: 149px">Desafio</p>
  </div>
</section>
